name: Release

# Fires when you push a version tag, e.g.  git tag v1.0.1 && git push --tags
#
# One tag, one workflow run, three jobs:
#   release  — desktop installers on all three OSes, uploaded to a DRAFT release
#   image    — the companion container, pushed to ghcr.io  (parallel with release)
#   publish  — flips the draft public, only after BOTH of the above succeed
#
# `release` and `image` declare no dependency on each other, so they start
# together and the run takes as long as the slower one, not their sum.
#
# Keep package.json "version" in sync with the tag you push — electron-builder
# names artifacts from the manifest, not the tag.
on:
  push:
    tags:
      - 'v*'

# Default for the jobs that touch the GitHub Release. The `image` job overrides
# this with its own (narrower) block — a job-level `permissions` replaces the
# workflow-level one outright rather than merging with it.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Provision the bundled CLI tools (firecrawl, playwright-cli) as a separate
      # top-level step — NOT a postinstall nested inside `npm ci`. A nested npm
      # install dies with EPERM on the Windows runner; a standalone step doesn't.
      - run: npm run cli-tools

      # electron-vite build + electron-builder. --publish always uploads the
      # platform's installer (and the latest*.yml auto-update feed) to the
      # public GitHub Release for this tag.
      #
      # The macOS step is separate because CSC_LINK / CSC_KEY_PASSWORD are
      # electron-builder's CROSS-PLATFORM signing vars — exposed on the Windows
      # runner they'd make it try (and fail) to sign the NSIS installer with
      # the Apple cert. Signing + notarization needs all five Apple secrets;
      # electron-builder notarizes (mac.notarize: true) using APPLE_ID /
      # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID.
      - if: runner.os == 'macOS'
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - if: runner.os != 'macOS'
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The companion container the desktop talks to, built from the SAME tag so the
  # two version numbers come from one commit — that's what makes the desktop's
  # "your companion is behind" check (versionCompare.ts) meaningful.
  #
  # Publishes ghcr.io/stephengpope/shockwave-companion:<tag> AND :latest. Both
  # matter: fresh installs pull :latest, while a remote upgrade pins
  # SHOCKWAVE_TAG to an exact tag so the compose files and the image are always
  # the same release. See "Remote upgrade" in api/CLAUDE.md.
  image:
    runs-on: ubuntu-latest
    # Narrower than the workflow default: this job writes to the package
    # registry and only reads the repo.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 emulation for the multi-arch build (amd64 VPSes + arm boxes).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A PRERELEASE TAG MUST NOT MOVE :latest. Fresh companion installs pull
      # :latest, so tagging an rc build with it would hand every new install a
      # test image. A tag is a prerelease iff it contains a hyphen — semver's
      # own rule, and the same test the publish job uses:
      #   v1.0.70      -> release     -> :v1.0.70 + :latest
      #   v1.0.70-rc1  -> prerelease  -> :v1.0.70-rc1 only
      - name: Work out the image tags
        id: imagetags
        run: |
          # printf builds the two-line list rather than an embedded literal
          # newline: inside a YAML block scalar a column-0 continuation line
          # would end the block.
          IMAGE=ghcr.io/stephengpope/shockwave-companion
          TAGS="${IMAGE}:${GITHUB_REF_NAME}"
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease $GITHUB_REF_NAME — leaving :latest alone" ;;
              *) TAGS="$(printf '%s\n%s' "$TAGS" "${IMAGE}:latest")" ;;
          esac
          {
            echo 'value<<TAGS_EOF'
            echo "$TAGS"
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          # Repo root — the Dockerfile pulls in agent-core/ and resources/.
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.imagetags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Flip the draft to public ONLY after every installer AND the companion image
  # are up.
  #
  # Why: package.json build.publish.releaseType is "draft", so electron-builder
  # uploads every artifact into a draft release. electron-updater only reads
  # PUBLISHED releases, so clients cannot see the release until this job runs —
  # which makes publishing atomic. Previously releaseType was "release", so the
  # release went public the moment the first platform finished while
  # `latest-mac.yml` (written last, after ~10min of macOS notarization) was
  # still missing; Mac clients polling in that window got a 404 for the update
  # feed.
  #
  # `needs: [release, image]` requires EVERY matrix job and the container build
  # to succeed, so a failure anywhere leaves an unpublished draft to inspect or
  # delete rather than a half-published release. Gating on `image` too is the
  # point of merging the two workflows: a desktop release that goes public
  # without its matching companion image tells users to upgrade to a companion
  # version that ghcr.io doesn't have.
  publish:
    needs: [release, image]
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the notes below are built from the commit range
      # between the previous version tag and this one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Write the release notes before publishing.
      #
      # electron-builder creates the draft with an EMPTY body and nothing else
      # ever filled it in, so every release through v1.0.36 has no notes at all.
      # That's invisible on github.com (the commit list is right there) but the
      # app's "What's new" dialog reads `body` over the API and had nothing to
      # show.
      #
      # **Notes are COMMIT SUBJECTS, not GitHub's generator.** `releases/generate-
      # notes` summarizes merged pull requests, and this repo commits straight to
      # main — asked for v1.0.36 it returns one line, a compare link, and nothing
      # else. The commit subjects here are already written as changelog lines
      # ("Telegram disconnect button uses primary style"), so they ARE the notes.
      #
      # The previous tag comes from `git tag --sort=-v:refname` rather than
      # `releases/latest`: at this point in the run our own release is still a
      # draft, so "latest" happens to mean the previous one — true today and
      # quietly wrong the first time a release doesn't get published.
      #
      # Best-effort on purpose (`|| true` plus the emptiness check below), so a
      # hiccup here can never leave a fully-built release stuck as a draft.
      # Shipping beats annotating.
      - name: Build release notes from commits
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1) || true
          if [ -n "$PREV" ]; then
            {
              echo "## What's changed"
              echo
              git log --no-merges --pretty=format:'%s' "$PREV..$GITHUB_REF_NAME" \
                | grep -v '^Release v' | sed 's/^/- /'
              echo
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_REF_NAME"
            } > notes.md || true
          fi

      # A PRERELEASE TAG MUST NOT BECOME "latest". electron-updater reads the
      # latest PUBLISHED release, so marking an rc as latest would offer it to
      # every desktop client. Same hyphen test as the image job above.
      - name: Publish the draft release
        run: |
          # An array, not a string: `gh release edit ... $FLAGS` would rely on
          # word splitting, which shellcheck flags (SC2086) and actionlint
          # surfaces as a workflow error.
          FLAGS=(--draft=false)
          case "$GITHUB_REF_NAME" in
            *-*) FLAGS+=(--prerelease --latest=false) ;;
              *) FLAGS+=(--latest) ;;
          esac
          if [ -s notes.md ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md \
              "${FLAGS[@]}" --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$GITHUB_REF_NAME" \
              "${FLAGS[@]}" --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
