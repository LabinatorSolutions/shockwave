name: Companion image

# Fires on the SAME version tag that cuts a desktop release (release.yml), so
# the companion image version and the desktop version are always the one git
# tag. Publishes ghcr.io/stephengpope/shockwave-companion:<tag> + :latest.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 emulation for the multi-arch build (amd64 VPSes + arm boxes).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Repo root — the Dockerfile pulls in agent-core/ and resources/.
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/stephengpope/shockwave-companion:${{ github.ref_name }}
            ghcr.io/stephengpope/shockwave-companion:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
