services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shockwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: shockwave
    volumes:
      - pg-data:/var/lib/postgresql/data
      # runs once on a fresh volume to create the schema
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # NOT exposed to the host by default — the api reaches it over the compose
    # network. Uncomment to inspect locally.
    # ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shockwave -d shockwave"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Published by .github/workflows/companion-image.yml on every release tag.
    # pull_policy `missing` makes plain `docker compose up -d` PULL this image
    # (the install-script path — no repo checkout on the box); dev overrides
    # with `docker compose up -d --build`, which always builds from source.
    image: ghcr.io/stephengpope/shockwave-companion:latest
    pull_policy: missing
    build:
      # Repo root so the build can reach ../agent-core (the shared agent runtime).
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shockwave:${POSTGRES_PASSWORD:?}@postgres:5432/shockwave
      MASTER_KEY: ${MASTER_KEY:?set in .env — 32 bytes base64}
      API_KEY: ${API_KEY:?set in .env}
      PORT: 8080
      # The Telegram webhook URL is derived from COMPANION_DOMAIN — one public host.
      COMPANION_DOMAIN: ${COMPANION_DOMAIN:-}
      # pi's per-run scratch (working copies of each chat's session file). On a
      # volume so a rebuild doesn't throw them away — losing them is survivable
      # (they're rebuilt from the stored transcript) but it's a needless refetch.
      AGENT_DATA_DIR: /data/agent
    # NOT a public surface. Bound to localhost only, for local dev / an
    # ngrok->raw tunnel. Public traffic goes through traefik (TLS, :443); it
    # reaches this container over the compose network as `api:8080`.
    ports:
      - "127.0.0.1:8080:8080"
    # autoheal (below) restarts this container when its HEALTHCHECK (in the
    # Dockerfile) flips to unhealthy — Docker's restart policy alone only
    # covers a crashed process, not a wedged one.
    labels:
      - autoheal=true
    volumes:
      # Shared with traefik: in self-signed mode the api writes the cert + a
      # dynamic TLS config here, which traefik's file provider picks up.
      - traefik-dynamic:/etc/traefik/dynamic
      - agent-data:/data/agent

  # One-shot: writes the Traefik dynamic router (self-signed vs Let's Encrypt)
  # from $COMPANION_DOMAIN into the shared config volume, then exits.
  traefik-config:
    image: alpine:3.20
    environment:
      COMPANION_DOMAIN: ${COMPANION_DOMAIN:-}
    volumes:
      - ./traefik/gen-router.sh:/gen-router.sh:ro
      - traefik-dynamic:/out
    command: ["sh", "/gen-router.sh"]
    restart: "no"

  # TLS terminator + reverse proxy — the ONLY public surface. :80 redirects to
  # :443. Self-signed by default; a real Let's Encrypt cert when COMPANION_DOMAIN
  # is set (see traefik/traefik.yml + traefik/gen-router.sh).
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    depends_on:
      traefik-config:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt

  # Restarts any container labeled autoheal=true when Docker marks it
  # unhealthy. Needs the docker socket to do so.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pg-data:
  agent-data:
  traefik-dynamic:
  letsencrypt:
