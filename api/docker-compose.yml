services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shockwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: shockwave
    volumes:
      - pg-data:/var/lib/postgresql/data
      # runs once on a fresh volume to create the schema
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # NOT exposed to the host by default — the api reaches it over the compose
    # network. Uncomment to inspect locally.
    # ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shockwave -d shockwave"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Published by the `image` job in .github/workflows/release.yml on every release tag.
    # pull_policy `missing` makes plain `docker compose up -d` PULL this image
    # (the install-script path — no repo checkout on the box); dev overrides
    # with `docker compose up -d --build`, which always builds from source.
    # SHOCKWAVE_TAG (written to .env by updater/apply.sh) pins the image to the
    # same release tag the compose/traefik files were fetched at; fresh installs
    # run `latest` until their first remote upgrade.
    image: ghcr.io/stephengpope/shockwave-companion:${SHOCKWAVE_TAG:-latest}
    pull_policy: missing
    # The companion's IDENTITY, and it must not move. `os.hostname()` is what
    # stamps every agent event and every `chat.running_machine` row, and in a
    # container that defaults to the container ID — a NEW value every time the
    # container is recreated, which is exactly what a remote upgrade does.
    #
    # Two things break when it moves. Boot clears the running marks this machine
    # left behind (`clearRunningForMachine`), and a redeployed container no
    # longer recognizes its predecessor's — so a turn interrupted by the upgrade
    # stays marked running forever, freezing that chat's composer on every
    # desktop. And the desktop shows this string to the user as "Running on …",
    # where a 12-character hex id names nothing they can identify.
    hostname: shockwave-companion
    build:
      # Repo root so the build can reach ../agent-core (the shared agent runtime).
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shockwave:${POSTGRES_PASSWORD:?}@postgres:5432/shockwave
      MASTER_KEY: ${MASTER_KEY:?set in .env — 32 bytes base64}
      API_KEY: ${API_KEY:?set in .env}
      PORT: 8080
      # The Telegram webhook URL is derived from COMPANION_DOMAIN — one public host.
      COMPANION_DOMAIN: ${COMPANION_DOMAIN:-}
      # This server's public address, recorded by the installer. With no domain
      # it's the public IP, and the self-signed certificate is issued for it at
      # boot. Not looked up at runtime: the installer already resolves it to print
      # your Server URL, and the certificate must match the address you type.
      COMPANION_HOST: ${COMPANION_HOST:-}
      # Everything the agent works in, on a volume so a rebuild doesn't throw it
      # away: pi's per-run scratch (runs/), inbound attachments (files/), the
      # workspace checkouts (work/) and the warm-checkout queue (pool/).
      #
      # The checkouts used to sit in the container's temp dir instead — the one
      # thing here that is expensive to rebuild was the one thing not kept — so
      # every restart and every remote upgrade made the next message in every
      # chat re-clone. They're derived from this path now (api/src/git.ts), so
      # there is no second variable to set.
      AGENT_DATA_DIR: /data/agent
      # pi's Anthropic prompt cache. The default tier expires 5 minutes after the
      # last message, which is shorter than the gaps in an ordinary Telegram
      # conversation — so most turns re-read the whole system prompt and the
      # entire history from scratch. `long` holds it for an hour.
      #
      # The trade is asymmetric, which is why it's on: a cache write costs 2x
      # base instead of 1.25x, but that applies only to the one new message,
      # while a miss reprocesses everything before it — and that grows with the
      # conversation. Read by pi-ai directly from the environment.
      PI_CACHE_RETENTION: long
      # Where POST /update drops the requested release tag for the updater
      # sidecar (shared volume; the sidecar polls it).
      UPDATE_TRIGGER_DIR: /trigger
    # NOT a public surface. Bound to localhost only, for local dev / an
    # ngrok->raw tunnel. Public traffic goes through traefik (TLS, :443); it
    # reaches this container over the compose network as `api:8080`.
    ports:
      - "127.0.0.1:8080:8080"
    # autoheal (below) restarts this container when its HEALTHCHECK (in the
    # Dockerfile) flips to unhealthy — Docker's restart policy alone only
    # covers a crashed process, not a wedged one.
    labels:
      - autoheal=true
    volumes:
      # Shared with traefik: in self-signed mode the api writes the cert + a
      # dynamic TLS config here, which traefik's file provider picks up.
      - traefik-dynamic:/etc/traefik/dynamic
      - agent-data:/data/agent
      - updater-trigger:/trigger

  # One-shot: writes the Traefik dynamic router (self-signed vs Let's Encrypt)
  # from $COMPANION_DOMAIN into the shared config volume, then exits.
  traefik-config:
    image: alpine:3.20
    environment:
      COMPANION_DOMAIN: ${COMPANION_DOMAIN:-}
    volumes:
      - ./traefik/gen-router.sh:/gen-router.sh:ro
      - traefik-dynamic:/out
    command: ["sh", "/gen-router.sh"]
    restart: "no"

  # TLS terminator + reverse proxy — the ONLY public surface. :80 redirects to
  # :443. Self-signed by default; a real Let's Encrypt cert when COMPANION_DOMAIN
  # is set (see traefik/traefik.yml + traefik/gen-router.sh).
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    depends_on:
      traefik-config:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      # Traefik's own variable name carries the ACME protocol name; ours doesn't,
      # because "certificate email" is what it means to whoever is filling it in.
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL: ${COMPANION_CERT_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt

  # Remote-upgrade sidecar. Polls the updater-trigger volume for a release tag
  # written by the api's POST /update, then spawns a detached one-shot helper
  # (updater/apply.sh) that fetches that tag's compose/traefik/updater files,
  # pins SHOCKWAVE_TAG in .env, pulls the tag's api image, and `up -d`s the
  # stack. Holds the docker socket — deliberately has NO network surface; the
  # trigger is a file. COMPANION_DIR must be the install dir's HOST path (the
  # helper bind-mounts it, and dockerd resolves bind paths on the host);
  # default matches install.sh's /opt/shockwave-companion.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    environment:
      COMPANION_DIR: ${COMPANION_DIR:-/opt/shockwave-companion}
      # Test hook — overrides where apply.sh fetches release files from
      # (file:// or http). Empty in production (raw.githubusercontent.com).
      SHOCKWAVE_RAW_BASE: ${SHOCKWAVE_RAW_BASE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./updater:/updater:ro
      - updater-trigger:/trigger
    entrypoint: ["sh", "/updater/watch.sh"]

  # Restarts any container labeled autoheal=true when Docker marks it
  # unhealthy. Needs the docker socket to do so.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pg-data:
  agent-data:
  traefik-dynamic:
  letsencrypt:
  updater-trigger:
